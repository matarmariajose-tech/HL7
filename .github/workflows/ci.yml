name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore Immunization.sln --locked-mode
      - run: dotnet build Immunization.sln -c Release --no-restore
      - run: dotnet test Immunization.sln -c Release --no-build --logger trx --results-directory artifacts/tests
      - run: python3 scripts/demo.py
